# For serving site locally
# Note: jekyll-remote-theme has issue with jekyll 4.0.0: https://github.com/benbalter/jekyll-remote-theme/pull/61
#       use jekyll 3.8.6, e.g. 'jekyll _3.8.6_ serve'
plugins:
 - jekyll-remote-theme
 - jekyll-seo-tag
 - jekyll-redirect-from

remote_theme: Labs64/NetLicensing-Wiki-template

url: "https://netlicensing.io"
# subpath of the site, e.g. /blog/
baseurl: "/wiki/"

repository: Labs64/wiki

# Enable or disable the site search
search_enabled: true

# Enable support for hyphenated search words:
search_tokenizer_separator: /[\s/]+/

# Aux links for the upper right navigation
aux_links:
  "NetLicensing Website":
    - "https://netlicensing.io"
  "Management Console":
    - "https://ui.netlicensing.io"
  "Service Status":
    - "https://status.netlicensing.io"

# Heading anchor links appear on hover over h1-h6 tags in page content
# allowing users to deep link to a particular heading on a page.
heading_anchors: true

# Footer content appears at the bottom of every page's main content
footer_content: "Copyright &copy; 2010 - 2026 <a href=\"https://www.labs64.com\">Labs64 GmbH</a>"
# footer links for the page bottom navigation
footer_links:
  "Labs64.IO Ecosystem - Your Agile Business Workflow Powerhouse":
    - "https://labs64.io"
  "GuideChimp - Interactive Guided Tours":
    - "https://www.labs64.com/guidechimp/"

# Google Analytics Tracking
# The former Universal Analytics property (UA-32654174-2) stopped collecting data in 2023;
# set a GA4 measurement ID (G-XXXXXXXXXX) here to re-enable analytics.
ga_tracking:
ga_tracking_anonymize_ip: true
# Zoho SalesIQ Code
zoho_salesiq_code: "57912641e38953d1e82182c4935dd7cc6768a402d6735d94c891a15169899c4bc025d1c7bcb6f0795fd8083772e86cd8"

# SEO
lang: en
title: NetLicensing Wiki
description: "Documentation for Labs64 NetLicensing, the Licensing-as-a-Service platform: licensing models, REST API, client libraries, integration guides, offline validation, Shop, Agent and MCP server."
logo: "assets/images/logos/netlicensing-logo-transparent.png"
email: info@netlicensing.io
# jekyll-seo-tag uses author.name as the JSON-LD publisher name
author:
  name: Labs64 NetLicensing
  type: Organization
  url: https://netlicensing.io
  twitter: netlicensing
twitter:
  username: netlicensing
  card: summary_large_image
social:
  name: Labs64 NetLicensing
  links:
    - https://www.linkedin.com/showcase/netlicensing/
    - https://www.xing.com/companies/labs64gmbh
    - https://github.com/Labs64/
    - https://www.facebook.com/netlicensing
    - https://twitter.com/netlicensing

# Home page Organization / SoftwareApplication structured data (theme include organization-jsonld.html).
# Keep this description identical to the one on netlicensing.io, the GitHub READMEs and directory profiles.
organization:
  name: Labs64 GmbH
  url: https://www.labs64.com
  logo: assets/images/logos/netlicensing-logo-transparent.png
software:
  name: Labs64 NetLicensing
  url: https://netlicensing.io
  category: BusinessApplication
  operating_system: Any
  description: "Labs64 NetLicensing is a cloud-based software license management service (Licensing-as-a-Service). Software vendors configure licensing models such as subscription, try-and-buy, floating, node-locked, pay-per-use and quota, then validate a customer's entitlements from their application with a single REST API call, without building and operating their own license server."

# Pages with this parent get FAQPage structured data (theme include faq-jsonld.html)
faq_parent: FAQ & Troubleshooting

# Default social preview (Open Graph / Twitter large card); a page's own `image:` front matter wins.
# jekyll-seo-tag reads the image from page front matter only, so it is set through defaults.
defaults:
  - scope:
      path: ""
    values:
      image: "https://netlicensing.io/img/netlicensing-stage-twitter.jpg"
