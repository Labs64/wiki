name: Lint NetLicensing Wiki

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Jekyll site
        # same image as docker-compose.yml; builds docs/ with the remote theme, like GitHub Pages
        run: |
          mkdir -p _site
          chmod -R a+rwX docs _site
          docker run --rm \
            -v "${{ github.workspace }}/docs:/srv/jekyll" \
            -v "${{ github.workspace }}/_site:/out" \
            -w /srv/jekyll \
            jekyll/jekyll:pages \
            jekyll build --future --strict_front_matter --baseurl "" -d /out

      - name: Check guided tour anchors
        run: python3 scripts/check-tour-anchors.py _site docs/assets/js/guidechimp-tours.js

      - name: Run HTMLProofer
        # internal links, images and scripts; external URLs are checked by the scheduled link audit instead
        run: |
          set +e
          docker run --rm --platform linux/amd64 \
            -v "${{ github.workspace }}/_site:/site" \
            ghcr.io/chabad360/htmlproofer:latest \
            htmlproofer /site \
            --checks "Links,Images,Scripts,OpenGraph" \
            --allow-hash-href \
            --disable-external \
            --ignore-urls "/\/blob\//" \
            --no-enforce-https \
            --log-level info \
            2>&1 | tee /tmp/htmlproofer.log
          status=${PIPESTATUS[0]}

          {
            echo "## HTMLProofer Results"
            echo ""
            if [ "$status" -eq 0 ]; then
              echo "✅ No issues found."
            else
              echo "❌ Issues found: $(grep -E 'found [0-9]+ failure' /tmp/htmlproofer.log)"
            fi
            echo ""
            echo "<details><summary>Full output</summary>"
            echo ""
            echo '```'
            cat /tmp/htmlproofer.log
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

          exit $status
